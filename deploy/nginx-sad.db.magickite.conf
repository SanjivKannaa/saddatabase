
# sadDatabase: DBA trainer (backend 127.0.0.1:8090, systemd --user saddatabase.service). Websocket terminals.
server {
    listen 100.80.248.95:443 ssl;
    listen 127.0.0.1:443 ssl;
    server_name sad.db.magickite;
    include snippets/magickite-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:8090;
        include snippets/magickite-proxy.conf;
        proxy_read_timeout 1h;          # idle web terminals
        proxy_buffering off;
    }
}
