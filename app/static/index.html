<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sadDatabase</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><ellipse cx='16' cy='7' rx='11' ry='4' fill='%23d97757'/><path d='M5 7v18c0 2.2 4.9 4 11 4s11-1.8 11-4V7' fill='none' stroke='%23d97757' stroke-width='2.5'/><circle cx='12' cy='17' r='1.5' fill='%23d97757'/><circle cx='20' cy='17' r='1.5' fill='%23d97757'/><path d='M11.5 23c2.5-2.2 6.5-2.2 9 0' fill='none' stroke='%23d97757' stroke-width='1.8' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f4ef; --panel: #fffdf8; --ink: #23201b; --muted: #6f685d; --line: #e3ddd1;
  --accent: #c25a3a; --accent-ink: #fff; --ok: #2f7d4f; --ok-bg: #e5f3ea; --bad: #b3362b; --bad-bg: #fbe9e6;
  --easy: #2f7d4f; --medium: #a46a10; --hard: #b3362b; --code-bg: #efeadf; --term: #1b1a17;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161513; --panel: #1f1d1a; --ink: #ece7dd; --muted: #a39c8f; --line: #34312c;
  --accent: #e07a58; --accent-ink: #1b1a17; --ok: #6cc28d; --ok-bg: #1d3226; --bad: #f08a7e; --bad-bg: #3a1f1b;
  --easy: #6cc28d; --medium: #e0b14f; --hard: #f08a7e; --code-bg: #2a2824; --term: #0f0e0d;
}}
:root[data-theme="dark"] {
  --bg: #161513; --panel: #1f1d1a; --ink: #ece7dd; --muted: #a39c8f; --line: #34312c;
  --accent: #e07a58; --accent-ink: #1b1a17; --ok: #6cc28d; --ok-bg: #1d3226; --bad: #f08a7e; --bad-bg: #3a1f1b;
  --easy: #6cc28d; --medium: #e0b14f; --hard: #f08a7e; --code-bg: #2a2824; --term: #0f0e0d;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif; }
a { color: var(--accent); }
code, pre { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; }
:not(pre) > code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
header { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header a.brand { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font: 600 18px "IBM Plex Mono", monospace; }
header nav { display: flex; gap: 14px; }
header nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
header nav a:hover, header nav a.on { color: var(--ink); }
header .spacer { flex: 1; }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.who img { width: 28px; height: 28px; border-radius: 50%; }
.who a { color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font: 600 28px/1.2 "IBM Plex Mono", monospace; margin: 8px 0; }
.lead { color: var(--muted); max-width: 660px; margin: 0 0 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s; }
a.card:hover { border-color: var(--accent); }
.card h3 { margin: 0; font-size: 17px; }
.card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.engine-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.bar { height: 6px; background: var(--code-bg); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.pill { border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.diff-easy { color: var(--easy); border-color: currentColor; } .diff-medium { color: var(--medium); border-color: currentColor; } .diff-hard { color: var(--hard); border-color: currentColor; }
.solved { color: var(--ok); font-weight: 600; }
/* track flow */
.flow { list-style: none; padding: 0; margin: 24px 0 0; position: relative; }
.flow::before { content: ""; position: absolute; left: 17px; top: 18px; bottom: 18px; width: 2px; background: var(--line); }
.flow li { display: grid; grid-template-columns: 36px 1fr; gap: 14px; margin-bottom: 14px; position: relative; }
.step { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 600 14px "IBM Plex Mono", monospace; background: var(--panel); border: 2px solid var(--line); z-index: 1; }
.step.done { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.step.tried { border-color: var(--medium); color: var(--medium); }
/* play */
.play { display: grid; grid-template-columns: minmax(300px, 410px) 1fr; gap: 16px; max-width: 1500px; margin: 0 auto; padding: 16px; height: calc(100vh - 62px); }
.task { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; overflow-y: auto; }
.task h2 { margin: 6px 0 8px; font-size: 22px; }
.termwrap { background: var(--term); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; min-height: 360px; position: relative; }
#term { flex: 1; min-height: 0; }
.idle { position: absolute; inset: 0; display: grid; place-items: center; color: #a39c8f; text-align: center; padding: 20px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
button, .btn { font: 500 14px "IBM Plex Sans", sans-serif; border-radius: 7px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.result { border-radius: 7px; padding: 10px 12px; margin: 10px 0; white-space: pre-wrap; font: 13px "IBM Plex Mono", monospace; }
.result.ok { background: var(--ok-bg); color: var(--ok); } .result.bad { background: var(--bad-bg); color: var(--bad); }
details { border-top: 1px solid var(--line); padding: 10px 0; }
summary { cursor: pointer; font-weight: 600; }
.hint { margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--accent); }
.timer { font: 13px "IBM Plex Mono", monospace; color: var(--muted); }
.back { font-size: 14px; text-decoration: none; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin: 18px 0 28px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.stat b { display: block; font: 600 26px "IBM Plex Mono", monospace; }
.stat span { color: var(--muted); font-size: 13px; }
.gbtn { background: #fff; color: #1f1f1f; border: 1px solid #dadce0; }
.notice { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
@media (max-width: 820px) {
  .play { grid-template-columns: 1fr; height: auto; }
  .termwrap { height: 70vh; }
  header .tagline { display: none; }
}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" data-link>
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="7" rx="11" ry="4" fill="var(--accent)"/><path d="M5 7v18c0 2.2 4.9 4 11 4s11-1.8 11-4V7" fill="none" stroke="var(--accent)" stroke-width="2.5"/><circle cx="12" cy="17" r="1.5" fill="var(--accent)"/><circle cx="20" cy="17" r="1.5" fill="var(--accent)"/><path d="M11.5 23c2.5-2.2 6.5-2.2 9 0" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/></svg>
    sadDatabase
  </a>
  <nav><a href="/" data-link>Tracks</a><a href="/leaderboard" data-link>Leaderboard</a></nav>
  <span class="spacer"></span>
  <div class="who" id="who"></div>
</header>
<div id="view"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => marked.parse(s || '');
const dur = s => s == null ? '–' : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s/60)}m ${s%60}s` : `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
const when = t => t ? new Date(t * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '–';
const api = async (path, opts = {}) => {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(body.detail || r.statusText); e.status = r.status; throw e; }
  return body;
};
let ME = { user: null }, cleanup = () => {};
const loginHref = () => `/auth/login?next=${encodeURIComponent(location.pathname)}`;
const signInButton = () => ME.google
  ? `<a class="btn gbtn" href="${loginHref()}"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.7l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</a>`
  : ME.dev_login ? `<a class="btn" href="/auth/dev?email=dev@localhost&next=${encodeURIComponent(location.pathname)}">Dev sign-in</a>` : '<span class="tagline">sign-in not configured</span>';

function go(path) { history.pushState({}, '', path); route(); }
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-link]');
  if (a && !e.metaKey && !e.ctrlKey) { e.preventDefault(); go(a.getAttribute('href')); }
});
window.addEventListener('popstate', route);

async function loadMe() {
  ME = await api('/api/me');
  $('#who').innerHTML = ME.user
    ? `<a href="/me" data-link>${ME.user.picture ? `<img src="${esc(ME.user.picture)}" alt="" referrerpolicy="no-referrer">` : ''}<span>${esc(ME.user.name)}</span></a>
       <button id="logout">Sign out</button>`
    : signInButton();
  const lo = $('#logout');
  if (lo) lo.onclick = async () => { await api('/auth/logout', { method: 'POST' }); await loadMe(); route(); };
}

async function route() {
  cleanup(); cleanup = () => {}; document.title = 'sadDatabase'; window.scrollTo(0, 0);
  document.querySelectorAll('header nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === location.pathname));
  const p = location.pathname;
  let m;
  try {
    if ((m = p.match(/^\/s\/([\w-]+)/))) return await scenarioView(m[1]);
    if ((m = p.match(/^\/t\/([\w-]+)/))) return await trackView(m[1]);
    if (p === '/me') return await meView();
    if (p === '/leaderboard') return await leaderboardView();
    return await homeView();
  } catch (e) { $('#view').innerHTML = `<main><h1>Hmm.</h1><p class="lead">${esc(e.message)}</p><a href="/" data-link>Back to tracks</a></main>`; }
}

/* ------------------------------------------------------------------ home: tracks */
async function homeView() {
  const tracks = await api('/api/tracks');
  const total = tracks.reduce((a, t) => a + t.scenarios.length, 0), solved = tracks.reduce((a, t) => a + t.solved, 0);
  $('#view').innerHTML = `<main>
    <h1>Something is wrong with the database.</h1>
    <p class="lead">Pick a track. Each scenario boots a disposable box with a broken database and gives you a real shell.
      Find the problem, fix it, press <b>Check</b>. ${ME.user ? `You've solved <b>${solved} of ${total}</b>.` : 'Sign in to start a box and keep your progress.'}</p>
    <div class="grid">${tracks.map(t => `
      <a class="card" href="/t/${t.engine}" data-link>
        <h3><span class="engine-dot" style="background:${t.color}"></span>${esc(t.name)} <span class="meta" style="display:inline">${esc(t.version)}</span></h3>
        <p>${esc(t.blurb)}</p>
        <div class="meta"><span>${t.scenarios.length} scenarios</span>${ME.user ? `<span>${t.solved} solved</span>` : ''}</div>
        <div class="bar"><i style="width:${t.scenarios.length ? 100 * t.solved / t.scenarios.length : 0}%"></i></div>
      </a>`).join('')}
    </div></main>`;
}

/* ------------------------------------------------------------------ track flow */
async function trackView(engine) {
  const t = (await api('/api/tracks')).find(t => t.engine === engine);
  if (!t) throw new Error('No such track.');
  document.title = `${t.name} · sadDatabase`;
  const next = t.scenarios.find(s => !s.solved);
  $('#view').innerHTML = `<main>
    <a class="back" href="/" data-link>← all tracks</a>
    <h1><span class="engine-dot" style="background:${t.color};width:14px;height:14px"></span>${esc(t.name)} ${esc(t.version)}</h1>
    <p class="lead">${esc(t.blurb)} Work through them in order: each builds on habits from the one before.</p>
    <div style="max-width:420px"><div class="meta" style="margin-bottom:6px">${t.solved} / ${t.scenarios.length} solved</div>
      <div class="bar"><i style="width:${100 * t.solved / t.scenarios.length}%"></i></div></div>
    <ol class="flow">${t.scenarios.map((s, i) => `
      <li><div class="step ${s.solved ? 'done' : s.attempts ? 'tried' : ''}">${s.solved ? '✓' : i + 1}</div>
        <a class="card" href="/s/${s.slug}" data-link ${next && next.slug === s.slug ? 'style="border-color:var(--accent)"' : ''}>
          <div class="meta"><span class="pill diff-${s.difficulty}">${s.difficulty}</span><span>~${s.minutes} min</span>
            ${s.solved ? `<span class="solved">✓ solved · best ${dur(s.best_seconds)}</span>` : s.attempts ? `<span>${s.attempts} attempt${s.attempts > 1 ? 's' : ''}</span>` : ''}
            ${next && next.slug === s.slug ? '<span style="color:var(--accent);font-weight:600">up next</span>' : ''}</div>
          <h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p>
          <div class="meta">${s.tags.map(x => `<span>#${esc(x)}</span>`).join('')}</div>
        </a></li>`).join('')}
    </ol></main>`;
}

/* ------------------------------------------------------------------ play */
async function scenarioView(slug) {
  const s = await api(`/api/scenarios/${slug}`);
  document.title = `${s.title} · sadDatabase`;
  $('#view').innerHTML = `<div class="play">
    <section class="task">
      <a class="back" href="/t/${s.engine}" data-link>← ${esc(s.engine_name)} track · ${s.position} of ${s.track_size}</a>
      <h2>${esc(s.title)}</h2>
      <div class="meta"><span class="pill diff-${s.difficulty}">${s.difficulty}</span><span>~${s.minutes} min</span>
        ${s.solved ? `<span class="solved">✓ solved · best ${dur(s.best_seconds)}</span>` : ''}<span class="timer" id="timer"></span></div>
      <div>${md(s.description)}</div>
      <div class="btns" id="btns"></div>
      <div id="result"></div>
      <details id="hints" ${s.hints.length ? 'open' : ''}><summary>Hints (${s.hints.length}/${s.hints_total})</summary><div id="hintlist"></div><div id="hintbtn"></div></details>
      <details id="sol" ${s.solution ? 'open' : ''}><summary>Solution &amp; lesson</summary><div id="solbody"></div></details>
    </section>
    <section class="termwrap"><div id="term"></div><div class="idle" id="idle"></div></section>
  </div>`;

  const renderHints = hints => {
    $('#hintlist').innerHTML = hints.map((h, i) => `<div class="hint"><b>${i + 1}.</b> ${md(h)}</div>`).join('');
    $('#hints summary').textContent = `Hints (${hints.length}/${s.hints_total})`;
    $('#hintbtn').innerHTML = !ME.user ? '<p class="meta">Sign in to use hints.</p>'
      : hints.length < s.hints_total ? '<button id="morehint">Show a hint</button>' : '';
    const b = $('#morehint');
    if (b) b.onclick = async () => renderHints((await api(`/api/scenarios/${slug}/hint`, { method: 'POST' })).hints);
  };
  const renderSolution = sol => {
    $('#solbody').innerHTML = sol ? md(sol) : !ME.user ? '<p class="meta">Sign in to see the solution.</p>'
      : '<p class="meta">Peeking is recorded on your profile (and the leaderboard counts clean solves first).</p><button id="showsol">I give up, show me</button>';
    const b = $('#showsol');
    if (b) b.onclick = async () => { renderSolution((await api(`/api/scenarios/${slug}/solution`, { method: 'POST' })).solution); $('#sol').open = true; };
  };
  renderHints(s.hints); renderSolution(s.solution);

  if (!ME.user) {
    $('#idle').innerHTML = `<div><p>Sign in to boot your own broken ${esc(s.engine_name)} box.</p>${signInButton()}</div>`;
    return;
  }
  $('#btns').innerHTML = `<button class="primary" id="start">Start scenario</button><button id="check" disabled>Check my solution</button><button id="end" disabled>End</button>`;
  $('#idle').innerHTML = 'Press <b>&nbsp;Start scenario&nbsp;</b> to get a shell on a fresh, broken box.';

  const css = getComputedStyle(document.documentElement);
  const term = new Terminal({ fontFamily: '"IBM Plex Mono", monospace', fontSize: 14, cursorBlink: true,
    theme: { background: css.getPropertyValue('--term').trim(), foreground: '#ece7dd', cursor: '#e07a58' } });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  let ws = null, sid = null, timerInt = null;
  const sendSize = () => ws && ws.readyState === 1 && ws.send(`\x00resize:${term.cols}x${term.rows}`);
  const onResize = () => { try { fit.fit(); } catch {} sendSize(); };
  window.addEventListener('resize', onResize);
  term.onData(d => ws && ws.readyState === 1 && ws.send(new TextEncoder().encode(d)));
  const openTerm = () => { $('#idle').style.display = 'none'; if (!term.element) term.open($('#term')); onResize(); };
  const setButtons = live => { $('#start').disabled = live; $('#check').disabled = !live; $('#end').disabled = !live;
    $('#start').textContent = live ? 'Running' : 'Start scenario'; };

  function startTimer(expires) {
    clearInterval(timerInt);
    const tick = () => {
      const left = Math.max(0, expires - Date.now() / 1000);
      if ($('#timer')) $('#timer').textContent = `⏱ ${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')} left`;
      if (left <= 0) { clearInterval(timerInt); teardown('Session expired.'); }
    };
    tick(); timerInt = setInterval(tick, 1000);
  }
  function connect() {
    openTerm();
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/sessions/${sid}/tty`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { sendSize(); term.focus(); };
    ws.onmessage = e => term.write(typeof e.data === 'string' ? e.data : new Uint8Array(e.data));
    ws.onclose = () => term.write('\r\n\x1b[90m[shell closed — press Enter to reconnect]\x1b[0m\r\n');
  }
  term.onKey(({ domEvent }) => { if (domEvent.key === 'Enter' && sid && (!ws || ws.readyState > 1)) connect(); });
  async function waitReady() {
    term.write('\x1b[90mbooting your broken box');
    for (let i = 0; i < 90; i++) {
      if ((await api(`/api/sessions/${sid}`)).ready) { term.write(' ✓\x1b[0m\r\n'); return; }
      term.write('.'); await new Promise(r => setTimeout(r, 1000));
    }
    throw new Error('the box did not come up in time');
  }
  function teardown(msg) {
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    clearInterval(timerInt); sid = null; setButtons(false);
    if ($('#timer')) $('#timer').textContent = '';
    if (msg) term.write(`\r\n\x1b[33m${msg}\x1b[0m\r\n`);
  }
  const showErr = msg => { $('#result').innerHTML = `<div class="result bad">${esc(msg)}</div>`; };

  $('#start').onclick = async () => {
    $('#start').disabled = true; $('#result').innerHTML = '';
    try {
      const st = await api('/api/sessions', { method: 'POST', body: JSON.stringify({ slug }) });
      sid = st.id; openTerm(); term.reset();
      await waitReady();
      setButtons(true); startTimer(st.expires_at); connect();
    } catch (e) {
      $('#start').disabled = false;
      if (e.status === 409 && ME.active_session) {
        const a = ME.active_session;
        $('#result').innerHTML = `<div class="result bad">${esc(e.message)}</div>
          <div class="btns"><a class="btn" href="/s/${a.slug}" data-link>Go to it</a><button id="killother">End it and start this one</button></div>`;
        $('#killother').onclick = async () => { await api(`/api/sessions/${a.id}`, { method: 'DELETE' }); await loadMe(); $('#start').click(); };
      } else showErr(e.message);
    }
    await loadMe();
  };
  $('#check').onclick = async () => {
    $('#check').disabled = true; $('#check').textContent = 'Checking…';
    try {
      const r = await api(`/api/sessions/${sid}/check`, { method: 'POST' });
      $('#result').innerHTML = `<div class="result ${r.passed ? 'ok' : 'bad'}">${r.passed ? `🎉 Solved in ${dur(r.seconds)}\n` : ''}${esc(r.output)}</div>`
        + (r.passed && s.next ? `<div class="btns"><a class="btn primary" href="/s/${s.next}" data-link>Next in track →</a></div>` : '')
        + (r.passed && !s.next ? `<div class="btns"><a class="btn primary" href="/t/${s.engine}" data-link>Track complete! Back to track</a></div>` : '');
      if (r.passed && s.next) $('#end').click();
    } catch (e) { showErr(e.message); }
    if ($('#check')) { $('#check').disabled = !sid; $('#check').textContent = 'Check my solution'; }
  };
  $('#end').onclick = async () => { try { await api(`/api/sessions/${sid}`, { method: 'DELETE' }); } catch {} teardown('Session ended. The box is gone.'); await loadMe(); };

  // reconnect to this scenario's running box (after a reload or navigation)
  const a = ME.active_session;
  if (a && a.slug === slug) { sid = a.id; setButtons(true); startTimer(a.expires_at); connect(); }
  cleanup = () => { window.removeEventListener('resize', onResize); clearInterval(timerInt); if (ws) { ws.onclose = null; ws.close(); } term.dispose(); };
}

/* ------------------------------------------------------------------ profile */
async function meView() {
  if (!ME.user) { $('#view').innerHTML = `<main><h1>Your progress</h1><p class="lead">Sign in to track your progress.</p>${signInButton()}</main>`; return; }
  const [tracks, hist] = await Promise.all([api('/api/tracks'), api('/api/me/history')]);
  const all = tracks.flatMap(t => t.scenarios), solved = all.filter(s => s.solved);
  const checks = hist.reduce((a, h) => a + h.checks, 0), peeks = hist.filter(h => h.solution_viewed).length;
  $('#view').innerHTML = `<main>
    <div style="display:flex;gap:14px;align-items:center">${ME.user.picture ? `<img src="${esc(ME.user.picture)}" alt="" referrerpolicy="no-referrer" style="width:56px;height:56px;border-radius:50%">` : ''}
      <div><h1 style="margin:0">${esc(ME.user.name)}</h1><div class="meta">${esc(ME.user.email)} · joined ${when(ME.user.created_at)}</div></div></div>
    <div class="stats">
      <div class="stat"><b>${solved.length}/${all.length}</b><span>scenarios solved</span></div>
      <div class="stat"><b>${hist.length}</b><span>boxes started</span></div>
      <div class="stat"><b>${checks}</b><span>checks run</span></div>
      <div class="stat"><b>${peeks}</b><span>solutions peeked</span></div>
    </div>
    <div class="grid">${tracks.map(t => `<a class="card" href="/t/${t.engine}" data-link>
      <h3><span class="engine-dot" style="background:${t.color}"></span>${esc(t.name)}</h3>
      <div class="meta">${t.solved} / ${t.scenarios.length} solved</div><div class="bar"><i style="width:${100 * t.solved / t.scenarios.length}%"></i></div></a>`).join('')}</div>
    <h2 style="margin-top:32px">History</h2>
    ${hist.length ? `<div class="tablewrap"><table><thead><tr><th>Scenario</th><th>Started</th><th>Result</th><th>Time</th><th>Checks</th><th>Hints</th></tr></thead><tbody>
      ${hist.map(h => `<tr><td><a href="/s/${h.slug}" data-link>${esc(h.title)}</a> <span class="meta" style="display:inline">${esc(h.engine)}</span></td>
        <td>${when(h.started_at)}</td>
        <td>${h.solved_at ? '<span class="solved">✓ solved</span>' : h.ended_at ? (h.end_reason === 'expired' ? 'expired' : 'gave up') : 'in progress'}${h.solution_viewed ? ' · peeked' : ''}</td>
        <td>${h.solved_at ? dur(h.solved_at - h.started_at) : '–'}</td><td>${h.checks}</td><td>${h.hints_used}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="lead">Nothing yet. <a href="/" data-link>Pick a track</a>.</p>'}
  </main>`;
}

/* ------------------------------------------------------------------ leaderboard */
async function leaderboardView() {
  const rows = await api('/api/leaderboard');
  $('#view').innerHTML = `<main><h1>Leaderboard</h1>
    <p class="lead">Ranked by clean solves (without peeking at the solution), then total solves, then the sum of best times.</p>
    ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>#</th><th>Who</th><th>Clean solves</th><th>Solves</th><th>Total best time</th><th>Last solve</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr ${ME.user && ME.user.id === r.id ? 'style="font-weight:600"' : ''}><td>${i + 1}</td>
      <td><span class="who">${r.picture ? `<img src="${esc(r.picture)}" alt="" referrerpolicy="no-referrer">` : ''}${esc(r.name)}</span></td>
      <td>${r.solved_clean}</td><td>${r.solved}</td><td>${dur(r.total_seconds)}</td><td>${when(r.last_solved_at)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="lead">No solves yet. Be the first.</p>'}</main>`;
}

loadMe().then(route);
</script>
